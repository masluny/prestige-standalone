name: Build release artefacts

# Triggers:
#   - push of a v* tag (e.g. v1.1.7)  -> build + attach to GitHub Release
#   - manual "Run workflow" button     -> build only, artefacts available
#     for download from the Actions run page (no release attached)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64) -- uses the existing Prestige.spec
          - os: macos-latest
            label: macos-arm64
            spec: Prestige.spec
            pack: ditto
            ext: zip
          # macOS Intel (x86_64) -- macos-13 still ships Intel runners
          - os: macos-13
            label: macos-x64
            spec: Prestige.spec
            pack: ditto
            ext: zip
          # Linux (Ubuntu, x86_64) -- uses the cross-platform spec
          - os: ubuntu-latest
            label: linux-x64
            spec: Prestige-cross.spec
            pack: tar
            ext: tar.gz
          # Windows (x86_64) -- uses the cross-platform spec
          - os: windows-latest
            label: windows-x64
            spec: Prestige-cross.spec
            pack: zip
            ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ------ Linux: pywebview needs GTK + WebKit2GTK on the build host
      - name: Install Linux system deps (webkit2gtk for pywebview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            libcairo2-dev \
            pkg-config \
            gir1.2-webkit2-4.1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pywebview>=5.0" "pyinstaller>=6.5" "pillow>=10"
          # pywebview on Linux needs the GTK back-end explicitly:
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install pywebview[gtk]
          fi
        shell: bash

      # ------ Icon generation (one squircle, several formats) -----------
      - name: Generate squircle PNG (and macOS .icns if applicable)
        shell: bash
        run: |
          python build_assets/make_icon.py
          if [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p build_assets/Prestige.iconset
            for size in 16 32 64 128 256 512 1024; do
              sips -z $size $size build_assets/Prestige_icon_1024.png \
                --out "build_assets/Prestige.iconset/icon_${size}x${size}.png" >/dev/null
              half=$((size / 2))
              if [ $size -ge 32 ]; then
                sips -z $half $half build_assets/Prestige_icon_1024.png \
                  --out "build_assets/Prestige.iconset/icon_${half}x${half}@2x.png" >/dev/null
              fi
            done
            iconutil -c icns -o build_assets/Prestige.icns build_assets/Prestige.iconset
          fi

      - name: Generate Windows .ico
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c @"
          from PIL import Image
          src = Image.open('build_assets/Prestige_icon_1024.png')
          src.save('build_assets/Prestige.ico', format='ICO',
                   sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          print('wrote build_assets/Prestige.ico')
          "@

      # ------ PyInstaller build -----------------------------------------
      - name: Run PyInstaller
        run: pyinstaller ${{ matrix.spec }} --clean --noconfirm
        shell: bash

      # ------ Packaging per OS ------------------------------------------
      - name: Package as zip (macOS, ditto)
        if: matrix.pack == 'ditto'
        shell: bash
        run: |
          cd dist
          ASSET="Prestige-${GITHUB_REF_NAME:-dev}-${{ matrix.label }}.zip"
          ditto -c -k --keepParent Prestige.app "$ASSET"
          echo "ASSET_PATH=dist/$ASSET" >> $GITHUB_ENV

      - name: Package as tar.gz (Linux)
        if: matrix.pack == 'tar'
        shell: bash
        run: |
          cd dist
          ASSET="Prestige-${GITHUB_REF_NAME:-dev}-${{ matrix.label }}.tar.gz"
          tar czf "$ASSET" Prestige/
          echo "ASSET_PATH=dist/$ASSET" >> $GITHUB_ENV

      - name: Package as zip (Windows)
        if: matrix.pack == 'zip' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { 'dev' }
          $asset = "Prestige-$tag-${{ matrix.label }}.zip"
          Compress-Archive -Path "dist\Prestige" -DestinationPath "dist\$asset"
          echo "ASSET_PATH=dist/$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ------ Upload as workflow artefact (always) ----------------------
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: prestige-${{ matrix.label }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

      # ------ Attach to GitHub Release (only on tag push) ---------------
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
